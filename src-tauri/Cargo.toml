[package]
name = "master-chat"
version = "0.2.1"
edition = "2021"

[lib]
name = "master_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.1"
sha2 = "0.11.1"
pbkdf2 = "0.13.0"
getrandom = "0.4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
winreg = "0.56.0"
webview2-com = "0.39.1"
windows-core = "0.62.2"
